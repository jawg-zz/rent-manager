{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block auth_content %}
<div class="card shadow-sm">
    <div class="card-body p-4">
        <div class="text-center mb-4">
            <h4 class="fw-bold"><i class="bi bi-building text-primary"></i> Rent<strong>Manager</strong></h4>
            <p class="text-muted small">Property Management System</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required autofocus placeholder="you@example.com">
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3">Sign In</button>
        </form>
        <div class="text-center">
            <span class="text-muted small">Don't have an account?</span>
            <a href="{{ url_for('auth.register') }}" class="small">Sign Up</a>
        </div>
        <div class="text-center mt-3">
            <small class="text-muted">Demo: landlord@demo.com / demo123</small>
        </div>
    </div>
</div>
{% endblock %}
