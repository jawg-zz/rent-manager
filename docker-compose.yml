services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      - DATABASE_URL=postgresql://rent_user:***@db:5432/rent_manager
      - SECRET_KEY=***
      - DEMO_MODE=true
      - TZ=Africa/Nairobi
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          cpus: "0.1"
          memory: "64M"
      restart_policy:
        condition: unless-stopped
        delay: 5s

  db:
    image: postgres:16-alpine
    expose:
      - "5432"
    environment:
      - POSTGRES_DB=rent_manager
      - POSTGRES_USER=rent_user
      - POSTGRES_PASSWORD=***
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rent_user -d rent_manager"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

volumes:
  pgdata:
